<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b48811" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Cross + Rays + Crown Ring -->
  <g transform="translate(15, 10)">
    <!-- Golden Sun Rays -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="50" cy="50" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
    
    <!-- Stylized Cross -->
    <path d="M50 12 V 88 M24 38 H 76" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 12 V 88 M24 38 H 76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dove/Flame Spark Accent -->
    <path d="M50 20 Q 56 26 50 32 Q 44 26 50 20 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="130" y="62" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#1e293b" letter-spacing="3">
    HAPHAK
  </text>
  <text x="328" y="62" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="url(#goldGrad)">
    2026
  </text>
  <text x="132" y="88" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="4">
    RETRAITE SPIRITUELLE ANNUELLE
  </text>
</svg>
