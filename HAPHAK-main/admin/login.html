<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur — HAPHAK 2026</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      height: 54px;
      margin-bottom: 1rem;
    }
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: #0f172a;
    }
    .login-sub {
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="../assets/logo.svg" alt="HAPHAK 2026 Logo" class="login-logo">
      <h1 class="login-title">Espace Administration</h1>
      <p class="login-sub">Connexion restreinte au comité d'organisation HAPHAK</p>
    </div>

    <div class="error-banner" id="login-error-banner" style="display:none; background:#fef2f2; color:#991b1b; padding:0.85rem; border-radius:8px; margin-bottom:1rem; font-size:0.85rem;"></div>

    <form id="admin-login-form">
      <div style="margin-bottom: 1.25rem;">
        <label style="display:block; font-weight:600; margin-bottom:0.4rem; font-size:0.9rem;" for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autofocus>
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display:block; font-weight:600; margin-bottom:0.4rem; font-size:0.9rem;" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-gold" style="width:100%;">
        Se connecter au Tableau de bord 🔐
      </button>
    </form>
  </div>

  <script src="js/admin-login.js"></script>
</body>
</html>
