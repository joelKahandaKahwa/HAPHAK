<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Code Entrée — HAPHAK 2026</title>
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    .scanner-card {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      display: none;
    }
    .result-box.success {
      display: block;
      background: #064e3b;
      color: #34d399;
      border: 2px solid #10b981;
    }
    .result-box.warning {
      display: block;
      background: #78350f;
      color: #fbbf24;
      border: 2px solid #f59e0b;
    }
    .result-box.danger {
      display: block;
      background: #7f1d1d;
      color: #fca5a5;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="scanner-card">
    <img src="../assets/logo.svg" alt="HAPHAK 2026" style="height: 48px; margin-bottom: 1rem;">
    <h1 style="font-family:'Outfit',sans-serif; font-size:1.5rem; color:#d4af37; margin-bottom:0.25rem;">
      Validation Entrée & QR Scanner
    </h1>
    <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:1.5rem;">
      Présentez le QR code du participant devant la caméra ou saisissez son numéro d'inscription.
    </p>

    <!-- Manual Code Entry Form -->
    <form id="scanner-manual-form" style="margin-bottom: 1.5rem;">
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="manual-code-input" class="form-input" placeholder="Ex: RET-2026-0001" style="background:#0f172a; color:#fff; border-color:#334155;" required>
        <button type="submit" class="btn btn-gold">Valider</button>
      </div>
    </form>

    <!-- Feedback Message Box -->
    <div id="scan-result-box" class="result-box"></div>

    <!-- Participant Details Card Preview -->
    <div id="scanned-participant-details" style="display:none; margin-top:1.5rem; text-align:left; background:#0f172a; padding:1.25rem; border-radius:12px; font-size:0.9rem;">
      <!-- Dynamic JS content -->
    </div>

    <div style="margin-top:2rem;">
      <a href="dashboard.html" class="btn btn-secondary btn-sm" style="color:#94a3b8;">← Retour au Tableau de Bord</a>
    </div>
  </div>

  <script src="js/admin-scanner.js"></script>
</body>
</html>
