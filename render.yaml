# ============================================================
# Configuration Render — Web Service + PostgreSQL
# ============================================================

databases:
  - name: haphak-db
    databaseName: haphak
    plan: free

services:
  - type: web
    name: haphak
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Fournie automatiquement par la base ci-dessus
      - key: DATABASE_URL
        fromDatabase:
          name: haphak-db
          property: connectionString

      # Généré automatiquement par Render
      - key: SESSION_SECRET
        generateValue: true

      # À renseigner dans le tableau de bord Render (Environment)
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
