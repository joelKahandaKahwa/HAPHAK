<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Administration HAPHAK</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="connexion">
    <div class="connexion__boite">
      <h1 class="connexion__titre">Administration</h1>
      <p class="connexion__sous">HAPHAK</p>

      <div class="alerte alerte--erreur" id="alerte" role="alert" hidden></div>

      <form id="form-connexion" novalidate>
        <div class="champ">
          <label class="champ__label" for="email">Identifiant</label>
          <input type="text" id="email" name="email" autocomplete="username" required />
        </div>

        <div class="champ">
          <label class="champ__label" for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="bouton bouton--principal" id="btn">Se connecter</button>
      </form>

      <p style="text-align:center;margin-top:22px;font-size:.84rem">
        <a href="index.html">Retour au site</a>
      </p>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    const formConnexion = document.getElementById('form-connexion');
    const btn = document.getElementById('btn');

    formConnexion.addEventListener('submit', async (e) => {
      e.preventDefault();
      masquerAlerte();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alerter('Veuillez saisir votre identifiant et votre mot de passe.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connexion…';

      try {
        await API.post('/api/login', { email, password });
        window.location.href = 'dashboard.html';
      } catch (err) {
        alerter(err.message);
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
